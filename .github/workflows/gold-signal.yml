# 黃金 XAUUSD 多空訊號（與幣圈機器人同一 Bot）
# 說明：GitHub Actions 排程約每小時整點 (UTC) 觸發，實際執行可能延遲數分鐘屬正常
name: "黃金訊號"

on:
  schedule:
    # 每小時整點 (UTC)，實際觸發時間可能延遲約 0–15 分鐘
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      reset_state:
        description: '強制清除倉位狀態？（輸入 yes 解除卡單鎖定，重新偵測訊號）'
        required: false
        default: 'no'

concurrency:
  group: gold-signal
  cancel-in-progress: false

jobs:
  run:
    # 僅排程或手動觸發時執行；若 yml 被設成 push 也觸發，則 push 時跳過避免失敗
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log run time (UTC)
        run: |
          echo "觸發時間 (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance

      - name: Restore gold signal state (追蹤用，避免同向訊號重疊)
        uses: actions/cache@v4
        with:
          path: gold_signal_bot/gold_signal_state
          key: gold-signal-state-${{ github.run_id }}
          restore-keys: |
            gold-signal-state-

      - name: Reset gold signal state (手動觸發時選填 yes 可強制清除卡單)
        if: github.event.inputs.reset_state == 'yes'
        run: |
          mkdir -p gold_signal_bot/gold_signal_state
          echo '{}' > gold_signal_bot/gold_signal_state/state.json
          echo "✅ gold signal state 已強制清除，本輪重新偵測訊號"

      - name: Run gold signal
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_GOLD_SIGNAL: ${{ secrets.TG_THREAD_GOLD_SIGNAL }}
          DC_TOKEN: ${{ secrets.DC_TOKEN }}
          DC_THREAD_IDS: ${{ secrets.DC_THREAD_IDS }}
          DC_THREAD_IDSgold_signal: ${{ secrets.DC_THREAD_IDSgold_signal }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          TG_THREAD_IDS_2: ${{ secrets.TG_THREAD_IDS_2 }}
        run: |
          timeout 300 python jackbot.py gold_signal || exit 0
          echo "黃金訊號任務完成"
