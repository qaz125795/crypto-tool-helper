# 黃金 XAUUSD 多空訊號（與幣圈機器人同一 Bot）
# 說明：GitHub Actions 排程約每小時整點 (UTC) 觸發，實際執行可能延遲數分鐘屬正常
name: "黃金訊號"

on:
  schedule:
    # 每小時整點 (UTC)，實際觸發時間可能延遲約 0–15 分鐘
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: gold-signal
  cancel-in-progress: false

jobs:
  run:
    # 僅排程或手動觸發時執行；若 yml 被設成 push 也觸發，則 push 時跳過避免失敗
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log run time (UTC)
        run: |
          echo "觸發時間 (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance

      - name: Run gold signal
        env:
          GOLD_DATA_SOURCE: bingx
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_GOLD_SIGNAL: ${{ secrets.TG_THREAD_GOLD_SIGNAL }}
        run: |
          timeout 300 python jackbot.py gold_signal || exit 0
          echo "黃金訊號任務完成"
