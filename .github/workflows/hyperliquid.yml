name: Hyperliquid 聰明錢監控

# 重要：GitHub 的 schedule 對「每 10 分鐘」常會延遲。若要真正每 10 分鐘推播，請用外部定時觸發（見 外部定時觸發推播_設定步驟.md）

on:
  schedule:
    # 每 10 分鐘（UTC）：05, 15, 25, 35, 45, 55 分。實際觸發可能延遲。
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

# 不取消進行中任務，確保每次觸發都能推播
concurrency:
  group: hyperliquid-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 使用 pip 緩存加速

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hyperliquid monitor task
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_HYPERLIQUID: ${{ secrets.TG_THREAD_HYPERLIQUID }}
        run: |
          # 設置超時保護，確保不會卡死
          timeout 480 python jackbot.py hyperliquid || exit 0
          echo "任務執行完成"

