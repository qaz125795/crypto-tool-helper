name: 大佬錢包動向追蹤

# 重要：GitHub schedule 非即時系統。若要更即時，建議改外部 Cron 或 WebSocket 常駐服務。

on:
  schedule:
    # GitHub Actions 最快約 5 分鐘；若要更即時請改外部 Cron/WebSocket 常駐
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 不取消進行中任務，確保每次觸發都能推播
concurrency:
  group: whale-wallet-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore data state cache
        uses: actions/cache@v4
        with:
          path: data
          key: data-hyperliquid-${{ runner.os }}

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 使用 pip 緩存加速

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run whale wallet tracker task
        env:
          # Discord Webhook（新大佬追蹤專用）
          WHALE_DC_WEBHOOK_URL: ${{ secrets.WHALE_DC_WEBHOOK_URL }}
          WHALE_DC_THREAD_ID: ${{ secrets.WHALE_DC_THREAD_ID }}
          # 鏈上掃描參數
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          WHALE_SPOT_MIN_USD: ${{ secrets.WHALE_SPOT_MIN_USD }}
          WHALE_LOOKBACK_SECONDS: ${{ secrets.WHALE_LOOKBACK_SECONDS }}
        run: |
          timeout 480 python jackbot.py hyperliquid || exit 0
          echo "任務執行完成"
