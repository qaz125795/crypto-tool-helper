name: 爆擊雷達

on:
  # schedule 已停用：改由 Zeabur 外部 Cron 以 workflow_dispatch 觸發，避免雙觸發重複推播
  # 若要恢復 GHA 自排程，取消下面兩行的註解（同時記得在 Zeabur 停用對應的 Cron）
  # schedule:
  #   - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: crit-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # actions/cache 寫入冷卻檔快取需要 write（僅影響 Actions 快取，非 repo contents）
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 跨 runner 保留冷卻檔（無 Gist 時的備援方案）
      # 使用動態 key（含 run_id），每次都寫入最新檔案；
      # restore-keys 前綴確保拿到上一輪的最新快取
      - name: Ensure data dir
        run: mkdir -p data

      - name: Restore crit radar cooldown cache
        id: cooldown-cache
        uses: actions/cache@v4
        with:
          path: data/crit_radar_cooldown.json
          key: crit-radar-cooldown-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            crit-radar-cooldown-${{ github.repository_id }}-

      - name: Run crit radar
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_CRIT_RADAR: ${{ secrets.TG_THREAD_CRIT_RADAR }}
          DC_TOKEN: ${{ secrets.DC_TOKEN }}
          DC_THREAD_IDS: ${{ secrets.DC_THREAD_IDS }}
          DC_THREAD_IDS_CRIT_RADAR: ${{ secrets.DC_THREAD_IDS_CRIT_RADAR }}
          DC_THREAD_IDScrit_radar: ${{ secrets.DC_THREAD_IDScrit_radar }}
          # 與持倉狙擊相同：跨 runner 保留爆擊冷卻，避免 15 分內重複推同幣
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          TG_THREAD_IDS_2: ${{ secrets.TG_THREAD_IDS_2 }}
        run: |
          timeout 600 python jackbot.py crit_radar || exit 0
          echo "任務執行完成"
