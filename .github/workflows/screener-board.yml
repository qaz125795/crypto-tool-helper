name: Screener 看板推播（每小時）

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

concurrency:
  group: screener-board
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener board
        env:
          PYTHONUNBUFFERED: 1
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          # 你提供的 TG 話題：-1003611242392_11584
          # 這裡拆成 chat_id 與 thread_id 供 Telegram Bot API 使用
          CHAT_ID: -1003611242392
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_SCREENER_BOARD: 11584
          DC_TOKEN: ${{ secrets.DC_TOKEN }}
          # 直接指定：確保程式能找到 DC_THREAD_IDS['screener_board']
          DC_THREAD_IDS: '{"screener_board":1501259126741663799}'
        run: |
          echo "=============================================="
          echo " Screener 看板推播啟動（每小時）"
          echo "=============================================="
          python -u jackbot.py screener_board
          echo "=============================================="
          echo " 任務執行完成"
          echo "=============================================="
