name: 資金費率排行榜

on:
  schedule:
    # 每天 0,4,8,12,16,20 點執行（UTC），錯峰 55 分
    - cron: '55 0,4,8,12,16,20 * * *'
  workflow_dispatch:

# 不取消進行中任務，確保每次觸發都能推播
concurrency:
  group: funding-rate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run funding rate task
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_FUNDING_RATE: ${{ secrets.TG_THREAD_FUNDING_RATE }}
          DC_TOKEN: ${{ secrets.DC_TOKEN }}
          DC_THREAD_IDS: ${{ secrets.DC_THREAD_IDS }}
          DC_THREAD_IDSfunding_rate: ${{ secrets.DC_THREAD_IDSfunding_rate }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          TG_THREAD_IDS_2: ${{ secrets.TG_THREAD_IDS_2 }}
        run: |
          timeout 480 python jackbot.py funding_rate || exit 0
          echo "任務執行完成"

