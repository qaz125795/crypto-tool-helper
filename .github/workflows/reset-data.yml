name: 清除所有冷卻與績效記錄（手動觸發）

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 用相同前綴 restore 舊 cache，讓 reset_data 覆蓋成空檔
      # 再以新 run_id 存回 → 下次 position-change 就讀到空的 data/
      - name: Restore data state (取得舊狀態以便覆蓋)
        uses: actions/cache@v4
        with:
          path: data
          key: data-position-change-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            data-position-change-${{ runner.os }}-

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 清除所有冷卻與績效記錄
        env:
          PYTHONUNBUFFERED: 1
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_POSITION_CHANGE: ${{ secrets.TG_THREAD_POSITION_CHANGE }}
        run: |
          echo "=============================================="
          echo " 開始清除所有冷卻、推播紀錄、績效數據..."
          echo "=============================================="
          python -u jackbot.py reset_data
          echo "=============================================="
          echo " 清除完成，下一輪 position_change 將全新開始"
          echo "=============================================="

      # ── 刪除所有舊 data cache ──────────────────────────────────────────
      # 問題根源：restore-keys 前綴配對偶爾會撿到 reset 之前的舊 cache，
      # 導致下一輪 position-change 還原到有資料的舊狀態。
      # 解法：reset 後主動透過 GitHub API 刪除所有 data-position-change-* cache，
      # 讓下一輪只能找到本次 reset 存入的空快取。
      - name: 刪除所有舊 data cache（防止下一輪還原舊資料）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🗑️ 開始刪除所有 data-position-change 快取..."
          REPO="${{ github.repository }}"
          # 列出所有符合前綴的 cache ID 並逐一刪除
          CACHE_IDS=$(gh api "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("data-position-change-")) | .id' 2>/dev/null || echo "")
          if [ -z "$CACHE_IDS" ]; then
            echo "✅ 無舊 cache 需要刪除"
          else
            echo "$CACHE_IDS" | xargs -r -I{} sh -c \
              'gh api -X DELETE "repos/${{ github.repository }}/actions/caches/{}" && echo "  ✅ 已刪除 cache ID: {}" || echo "  ⚠️ 刪除失敗 ID: {}"'
            echo "✅ 舊 cache 清除完畢，下一輪將從空資料開始"
          fi

      - name: 確認清除結果
        run: |
          echo "--- data/ 目錄內容 ---"
          ls -la data/ 2>/dev/null || echo "(目錄為空)"
          echo "--- sniper_cooldown.json ---"
          cat data/sniper_cooldown.json 2>/dev/null || echo "(檔案不存在)"
          echo "--- performance_history.json ---"
          cat data/performance_history.json 2>/dev/null || echo "(檔案不存在)"
