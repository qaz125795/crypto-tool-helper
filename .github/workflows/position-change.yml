# 持倉變化狙擊鏡：僅由「外部定時服務」觸發（workflow_dispatch）
# 不使用 GitHub schedule，改由 cron-job.org 等每 30 分鐘打 API，避免漏跑
name: 持倉變化篩選（30分鐘循環）

on:
  workflow_dispatch:

concurrency:
  group: position-change
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore data state (冷卻歷史)
        uses: actions/cache@v4
        with:
          path: data
          key: data-position-change-${{ runner.os }}

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run position change (狙擊鏡)
        env:
          PYTHONUNBUFFERED: 1
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_POSITION_CHANGE: ${{ secrets.TG_THREAD_POSITION_CHANGE }}
        run: |
          echo "=============================================="
          echo " 持倉變化篩選 Action 開始（log 即時輸出）"
          echo "=============================================="
          timeout 960 python -u jackbot.py position_change || exit 0
          echo "=============================================="
          echo " 任務執行完成"
          echo "=============================================="
