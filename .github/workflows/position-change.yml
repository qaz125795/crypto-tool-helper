name: 持倉變化篩選（15分鐘循環）

# 重要：GitHub Actions 的 schedule 對「每 15 分鐘」常會延遲（30 分鐘～數小時才觸發一次）。
# 若要「真正每 15 分鐘」推播，請用外部定時服務呼叫 workflow_dispatch，見：外部定時觸發推播_設定步驟.md

on:
  schedule:
    # 每 15 分鐘（UTC）：00, 15, 30, 45 分。實際觸發時間由 GitHub 排程，可能延遲。
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:

# 不取消進行中的任務：讓每次觸發都能跑完並推播，避免延遲或漏推
concurrency:
  group: position-change
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12  # 腳本會在 8 分鐘內強制結束並推播
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 使用 pip 緩存加速

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run position change task (15min cycle)
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_POSITION_CHANGE: ${{ secrets.TG_THREAD_POSITION_CHANGE }}
        run: |
          # 腳本內建 8 分鐘強制結束，此處 10 分鐘為雙重保護
          timeout 600 python jackbot.py position_change || exit 0
          echo "任務執行完成"

