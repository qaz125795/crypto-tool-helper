# 持倉變化狙擊鏡：整點與半點各跑一次（UTC :00 與 :30）
# ⚠️ GitHub 內建 schedule 不保證準時，可能延遲或漏跑。要「固定準時」請用外部 cron 觸發 workflow_dispatch，
#    見 .github/持倉狙擊鏡準時觸發說明.md
name: 持倉變化篩選（30分鐘循環）

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

concurrency:
  group: position-change
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore data state (冷卻歷史)
        uses: actions/cache@v4
        with:
          path: data
          key: data-position-change-${{ runner.os }}

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run position change (狙擊鏡)
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_POSITION_CHANGE: ${{ secrets.TG_THREAD_POSITION_CHANGE }}
        run: |
          timeout 960 python jackbot.py position_change || exit 0
          echo "任務執行完成"
