name: 持倉變化篩選（15分鐘循環）

on:
  schedule:
    # 每 15 分鐘執行一次（UTC），錯開 1 分鐘減少與其他 workflow 搶 runner
    # 執行時間：01, 16, 31, 46 分（每小時）
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:

# 不取消進行中的任務：讓每次觸發都能跑完並推播，避免延遲或漏推
concurrency:
  group: position-change
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12  # 腳本會在 8 分鐘內強制結束並推播
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 使用 pip 緩存加速

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run position change task (15min cycle)
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_POSITION_CHANGE: ${{ secrets.TG_THREAD_POSITION_CHANGE }}
        run: |
          # 腳本內建 8 分鐘強制結束，此處 10 分鐘為雙重保護
          timeout 600 python jackbot.py position_change || exit 0
          echo "任務執行完成"

