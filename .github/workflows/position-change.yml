# 持倉變化狙擊鏡：僅由「外部定時服務」觸發（workflow_dispatch）
# 不使用 GitHub schedule；可自訂 cron（例如每 5 分鐘）打 API，與程式內 5m/15m OI、5m K 線偵測對齊
name: 持倉變化篩選（外部定時觸發）

on:
  schedule:
    # 每 5 分鐘執行一次（UTC）
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 若為 true：新排程會「取消」尚未跑完的一輪 → enrichment 久時每 5 分鐘必被砍（The operation was canceled）。
# false：同群組排隊，上一輪跑完才跑下一輪，避免狙擊鏡被中途取消。
concurrency:
  group: position-change
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 狙擊狀態檔（冷卻+推播紀錄同一 JSON）必須「每次跑完都寫回」cache，否則：
      # - 下一輪會還原舊檔、同幣同向又推一次
      # - 倉位追蹤(SL/TP1/TP2/籌碼反轉) 讀不到上一輪推過的訊號 → 永遠 0 筆、不會發追蹤推播
      # 用 run_id 當 key 一部份 → 每次都是新 key → 一定會 save；restore-keys 取前綴 → 還原上一輪的 cache。
      - name: Restore data state (冷卻歷史)
        uses: actions/cache@v4
        with:
          path: data
          key: data-position-change-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            data-position-change-${{ runner.os }}-

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run position change (狙擊鏡)
        env:
          PYTHONUNBUFFERED: 1
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_POSITION_CHANGE: ${{ secrets.TG_THREAD_POSITION_CHANGE }}
          DC_TOKEN: ${{ secrets.DC_TOKEN }}
          DC_THREAD_IDS: ${{ secrets.DC_THREAD_IDS }}
          DC_THREAD_IDSposition_change: ${{ secrets.DC_THREAD_IDSposition_change }}
          # 短打模式（可在 Actions Secrets 覆寫）
          SNIPER_FAST_MODE: ${{ secrets.SNIPER_FAST_MODE }}
          SNIPER_TP1_R: ${{ secrets.SNIPER_TP1_R }}
          SNIPER_TP2_R: ${{ secrets.SNIPER_TP2_R }}
          SNIPER_MIN_SL_PCT: ${{ secrets.SNIPER_MIN_SL_PCT }}
          SNIPER_COOLDOWN_HOURS: ${{ secrets.SNIPER_COOLDOWN_HOURS }}
          # 與 Zeabur／爆擊雷達一致：跨 runner 保留狙擊冷卻與 pending（僅讀寫 gist 內 sniper 檔，不覆蓋爆擊檔）
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          TG_THREAD_IDS_2: ${{ secrets.TG_THREAD_IDS_2 }}
        run: |
          echo "=============================================="
          echo " 持倉變化篩選 Action 開始（log 即時輸出）"
          echo "=============================================="
          # 須 ≤ job timeout-minutes；過短會讓長輪掃描被 kill（與 concurrency 取消不同）
          timeout 25m python -u jackbot.py position_change || exit 0
          echo "=============================================="
          echo " 任務執行完成"
          echo "=============================================="
