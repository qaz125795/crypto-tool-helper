name: 持倉變化篩選（30分鐘循環）

# 數據為 30m 顆粒度（價格 + OI），觸發器改為每 30 分鐘與數據週期一致。
# 若需更頻繁可改 cron 或使用外部定時呼叫 workflow_dispatch，見：外部定時觸發推播_設定步驟.md

on:
  schedule:
    # 每 30 分鐘（UTC）：00, 30 分
    - cron: '0,30 * * * *'
  workflow_dispatch:

# 不取消進行中的任務：讓每次觸發都能跑完並推播，避免延遲或漏推
concurrency:
  group: position-change
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 16  # 與腳本內建 16 分鐘強制結束一致
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 使用 pip 緩存加速

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run position change task (30min cycle)
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_POSITION_CHANGE: ${{ secrets.TG_THREAD_POSITION_CHANGE }}
        run: |
          # 腳本內建 16 分鐘強制結束，此處 16 分鐘為雙重保護（外層 8/10 已改為 16/16）
          timeout 960 python jackbot.py position_change || exit 0
          echo "任務執行完成"

