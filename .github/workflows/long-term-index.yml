name: 長線牛熊導航儀

on:
  schedule:
    # 每 4 小時執行（UTC），錯峰 48 分
    - cron: '48 */4 * * *'
  workflow_dispatch:

# 防止並發執行
concurrency:
  group: long-term-index
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run long term index task
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_LONG_TERM_INDEX: ${{ secrets.TG_THREAD_LONG_TERM_INDEX }}
          DC_TOKEN: ${{ secrets.DC_TOKEN }}
          DC_THREAD_IDS: ${{ secrets.DC_THREAD_IDS }}
          DC_THREAD_IDSlong_term_index: ${{ secrets.DC_THREAD_IDSlong_term_index }}
        run: |
          timeout 480 python jackbot.py long_term_index_once || exit 0
          echo "任務執行完成"

