name: 流動性獵取雷達

on:
  schedule:
    # 每小時執行（UTC），錯峰 50 分
    - cron: '50 * * * *'
  workflow_dispatch:

# 不取消進行中任務，確保每次觸發都能推播
concurrency:
  group: liquidity-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 使用 pip 緩存加速

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run liquidity radar task
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_LIQUIDITY_RADAR: ${{ secrets.TG_THREAD_LIQUIDITY_RADAR }}
          DC_TOKEN: ${{ secrets.DC_TOKEN }}
          DC_THREAD_IDS: ${{ secrets.DC_THREAD_IDS }}
          DC_THREAD_IDSliquidity_radar: ${{ secrets.DC_THREAD_IDSliquidity_radar }}
          # 清算柱狀圖：限制每次同步天數，避免 Actions 首次下載過久
          LIQ_CHART_MAX_SYNC_DAYS: "10"
          LIQ_CHART_LOOKBACK_DAYS: "180"
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          TG_THREAD_IDS_2: ${{ secrets.TG_THREAD_IDS_2 }}
        run: |
          # 設置超時保護（含 matplotlib 繪圖與 Binance 快照下載）
          timeout 600 python jackbot.py liquidity_radar || exit 0
          echo "任務執行完成"

