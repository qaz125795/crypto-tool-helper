name: 新聞快訊推播

on:
  schedule:
    # 每 4 小時執行（UTC），錯峰 20 分避免整點擠在一起
    - cron: '20 */4 * * *'
  workflow_dispatch:

# 防止並發執行
concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore data state cache
        uses: actions/cache@v4
        with:
          path: data
          key: data-news-${{ runner.os }}

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news task
        env:
          TREE_API_KEY: ${{ secrets.TREE_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_NEWS: ${{ secrets.TG_THREAD_NEWS }}
        run: |
          timeout 480 python jackbot.py news || exit 0
          echo "任務執行完成"
