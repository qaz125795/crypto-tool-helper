name: 購買力監控（穩定幣市值 + OI 監控）

on:
  schedule:
    # 每 2 小時執行一次（UTC），錯峰 25 分
    - cron: '25 */2 * * *'
  workflow_dispatch:

# 不取消進行中任務，確保每次觸發都能推播
concurrency:
  group: buying-power-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run buying power monitor task
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_THREAD_IDS: ${{ secrets.TG_THREAD_IDS }}
          TG_THREAD_WHALE_POSITION: ${{ secrets.TG_THREAD_WHALE_POSITION }}
          DC_TOKEN: ${{ secrets.DC_TOKEN }}
          DC_THREAD_IDS: ${{ secrets.DC_THREAD_IDS }}
          DC_THREAD_IDSbuying_power_monitor: ${{ secrets.DC_THREAD_IDSbuying_power_monitor }}
        run: |
          timeout 480 python jackbot.py buying_power_monitor || exit 0
          echo "任務執行完成"
